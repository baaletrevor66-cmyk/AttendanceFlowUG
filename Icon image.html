<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendanceFlow - App Icon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0d1b2a 0%, #1b3a4b 50%, #0d1b2a 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
            max-width: 1200px;
        }

        h1 {
            color: white;
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .icons-showcase {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 50px;
            width: 100%;
        }

        .icon-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .icon-display {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
        }

        .icon-192 {
            width: 280px;
            height: 280px;
        }

        .icon-512 {
            width: 620px;
            height: 620px;
        }

        .size-label {
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .download-controls {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #2dd4bf 0%, #a3e635 100%);
            color: #0d1b2a;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(45, 212, 191, 0.3);
        }

        .info-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.6;
            max-width: 600px;
        }

        .info-box strong {
            color: #a3e635;
        }
    </style>
    <style>
        @view-transition {
            navigation: auto;
        }
    </style>
    <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
    <script src="/_sdk/element_sdk.js" type="text/javascript"></script>
    <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
</head>

<body>
    <div class="container">
        <h1>AttendanceFlow App Icon</h1>
        <div class="icons-showcase"><!-- 192x192 Icon -->
            <div class="icon-section">
                <div class="icon-display icon-192">
                    <svg viewbox="0 0 192 192" xmlns="http://www.w3.org/2000/svg"><!-- Background Gradient -->
                        <defs>
                            <lineargradient id="gradient192" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#a3e635;stop-opacity:1" />
                            </lineargradient>
                            <filter id="shadow192">
                                <fedropshadow dx="0" dy="8" stddeviation="12" flood-opacity="0.3" />
                            </filter>
                        </defs> <!-- Rounded Square Background -->
                        <rect x="0" y="0" width="192" height="192" rx="44" ry="44" fill="url(#gradient192)"
                            filter="url(#shadow192)" /> <!-- Dark Overlay for Depth -->
                        <rect x="0" y="0" width="192" height="192" rx="44" ry="44" fill="#000000" opacity="0.15" />
                        <!-- Shield Shape -->
                        <g transform="translate(96, 96)"><!-- Shield Background -->
                            <path d="M -32 -32 L 32 -32 L 32 0 Q 32 32 0 48 Q -32 32 -32 0 Z" fill="#ffffff"
                                opacity="0.9" /> <!-- Inner Shield -->
                            <path d="M -28 -28 L 28 -28 L 28 -2 Q 28 28 0 42 Q -28 28 -28 -2 Z" fill="#ffffff"
                                opacity="0.95" /> <!-- Checkmark -->
                            <g stroke="#2dd4bf" stroke-width="5" fill="none" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M -12 8 L -2 18 L 16 -4" />
                            </g>
                        </g>
                    </svg>
                </div><span class="size-label">192 × 192 px</span>
                <div class="download-controls"><button onclick="downloadIcon(192)">↓ Download PNG</button> <button
                        onclick="copySVG(192)">📋 Copy SVG</button>
                </div>
            </div><!-- 512x512 Icon -->
            <div class="icon-section">
                <div class="icon-display icon-512">
                    <svg viewbox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><!-- Background Gradient -->
                        <defs>
                            <lineargradient id="gradient512" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#a3e635;stop-opacity:1" />
                            </lineargradient>
                            <filter id="shadow512">
                                <fedropshadow dx="0" dy="20" stddeviation="30" flood-opacity="0.3" />
                            </filter>
                        </defs> <!-- Rounded Square Background -->
                        <rect x="0" y="0" width="512" height="512" rx="120" ry="120" fill="url(#gradient512)"
                            filter="url(#shadow512)" /> <!-- Dark Overlay for Depth -->
                        <rect x="0" y="0" width="512" height="512" rx="120" ry="120" fill="#000000" opacity="0.15" />
                        <!-- Shield Shape -->
                        <g transform="translate(256, 256)"><!-- Shield Background -->
                            <path d="M -85 -85 L 85 -85 L 85 0 Q 85 85 0 128 Q -85 85 -85 0 Z" fill="#ffffff"
                                opacity="0.9" /> <!-- Inner Shield -->
                            <path d="M -75 -75 L 75 -75 L 75 -5 Q 75 75 0 112 Q -75 75 -75 -5 Z" fill="#ffffff"
                                opacity="0.95" /> <!-- Checkmark -->
                            <g stroke="#2dd4bf" stroke-width="14" fill="none" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M -30 20 L -5 48 L 45 -10" />
                            </g>
                        </g>
                    </svg>
                </div><span class="size-label">512 × 512 px</span>
                <div class="download-controls"><button onclick="downloadIcon(512)">↓ Download PNG</button> <button
                        onclick="copySVG(512)">📋 Copy SVG</button>
                </div>
            </div>
        </div>
        <div class="info-box"><strong>📌 Quick Setup:</strong> Download both PNG files and add them to your project's
            <code>public/icons/</code> directory as <strong>icon-192x192.png</strong> and
            <strong>icon-512x512.png</strong>. Use the Copy SVG buttons to get the raw SVG code for web use.
        </div>
    </div>
    <script>
        function getSVG(size) {
            if (size === 192) {
                return `<svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="gradient192" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#a3e635;stop-opacity:1" />
            </linearGradient>
            <filter id="shadow192">
              <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
            </filter>
          </defs>
          <rect x="0" y="0" width="192" height="192" rx="44" ry="44" fill="url(#gradient192)" filter="url(#shadow192)"/>
          <rect x="0" y="0" width="192" height="192" rx="44" ry="44" fill="#000000" opacity="0.15"/>
          <g transform="translate(96, 96)">
            <path d="M -32 -32 L 32 -32 L 32 0 Q 32 32 0 48 Q -32 32 -32 0 Z" fill="#ffffff" opacity="0.9"/>
            <path d="M -28 -28 L 28 -28 L 28 -2 Q 28 28 0 42 Q -28 28 -28 -2 Z" fill="#ffffff" opacity="0.95"/>
            <g stroke="#2dd4bf" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M -12 8 L -2 18 L 16 -4"/>
            </g>
          </g>
        </svg>`;
            } else {
                return `<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="gradient512" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#a3e635;stop-opacity:1" />
            </linearGradient>
            <filter id="shadow512">
              <feDropShadow dx="0" dy="20" stdDeviation="30" flood-opacity="0.3"/>
            </filter>
          </defs>
          <rect x="0" y="0" width="512" height="512" rx="120" ry="120" fill="url(#gradient512)" filter="url(#shadow512)"/>
          <rect x="0" y="0" width="512" height="512" rx="120" ry="120" fill="#000000" opacity="0.15"/>
          <g transform="translate(256, 256)">
            <path d="M -85 -85 L 85 -85 L 85 0 Q 85 85 0 128 Q -85 85 -85 0 Z" fill="#ffffff" opacity="0.9"/>
            <path d="M -75 -75 L 75 -75 L 75 -5 Q 75 75 0 112 Q -75 75 -75 -5 Z" fill="#ffffff" opacity="0.95"/>
            <g stroke="#2dd4bf" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M -30 20 L -5 48 L 45 -10"/>
            </g>
          </g>
        </svg>`;
            }
        }

        function copySVG(size) {
            const svg = getSVG(size);
            navigator.clipboard.writeText(svg).then(() => {
                alert(`✓ ${size}x${size} SVG copied to clipboard!`);
            }).catch(() => {
                alert('Failed to copy. Please try again.');
            });
        }

        function downloadIcon(size) {
            const svg = getSVG(size);
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;

            const ctx = canvas.getContext('2d');
            const img = new Image();

            img.onload = () => {
                ctx.drawImage(img, 0, 0);
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = `icon-${size}x${size}.png`;
                link.click();
            };

            img.src = 'data:image/svg+xml;base64,' + btoa(svg);
        }
    </script>

</body>

</html>
